name: Smart Insurance CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  backend:
    name: Backend Build and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/claims

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: smart_insurance_claims
          POSTGRES_USER: insurance_app
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insurance_app -d smart_insurance_claims"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/smart_insurance_claims
      DB_USERNAME: insurance_app
      DB_PASSWORD: ci_password
      JWT_SECRET: SmartInsuranceClaimsCITestJwtSecretKey2026MinimumLength123456
      CLAIMS_UPLOAD_DIRECTORY: /tmp/smart-insurance-claims

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/claims/pom.xml

      - name: Run backend tests
        run: mvn --batch-mode clean test

      - name: Package backend
        run: mvn --batch-mode package -DskipTests


  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build


  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t smart-insurance-backend ./backend/claims

      - name: Build frontend image
        run: docker build -t smart-insurance-frontend ./frontend
