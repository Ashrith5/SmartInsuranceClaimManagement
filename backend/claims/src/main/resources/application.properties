# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_insurance_claims}
spring.datasource.username=${DB_USERNAME:insurance_app}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Claim Document Storage
app.upload.claims-directory=${CLAIMS_UPLOAD_DIRECTORY:C:/TalentFarm/SmartInsuranceClaimManagement/uploads/claims}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
